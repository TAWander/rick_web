    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var pswpImageElements = document.querySelectorAll('.pswp-image');
            
            pswpImageElements.forEach(function(el) {
                el.style.cursor = 'zoom-in';
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    var clickedIndex = Array.prototype.indexOf.call(pswpImageElements, el);
                    
                    var loadImagesAndOpenGallery = function() {
                        var items = [];
                        var loadedCount = 0;
                        var totalCount = pswpImageElements.length;
                        
                        pswpImageElements.forEach(function(imgEl, index) {
                            var src = imgEl.getAttribute('data-pswp-src');
                            var tempImg = new Image();
                            tempImg.onload = function() {
                                items[index] = {
                                    src: src,
                                    w: tempImg.naturalWidth || parseInt(imgEl.getAttribute('data-image-width')) || 1200,
                                    h: tempImg.naturalHeight || parseInt(imgEl.getAttribute('data-image-height')) || 800
                                };
                                loadedCount++;
                                if (loadedCount === totalCount) {
                                    openGallery(items, clickedIndex);
                                }
                            };
                            tempImg.onerror = function() {
                                items[index] = {
                                    src: src,
                                    w: parseInt(imgEl.getAttribute('data-image-width')) || 1200,
                                    h: parseInt(imgEl.getAttribute('data-image-height')) || 800
                                };
                                loadedCount++;
                                if (loadedCount === totalCount) {
                                    openGallery(items, clickedIndex);
                                }
                            };
                            tempImg.src = src;
                        });
                    };
                    
                    var openGallery = function(items, startIndex) {
                        var options = {
                            index: startIndex,
                            bgOpacity: 0.85,
                            showHideOpacity: true
                        };
                        var gallery = new PhotoSwipe(document.querySelector('.pswp'), PhotoSwipeUI_Default, items, options);
                        gallery.init();
                    };
                    
                    loadImagesAndOpenGallery();
                });
            });
        });
    </script>
