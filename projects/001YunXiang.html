    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/4.1.3/photoswipe-ui-default.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var pswpImageElements = document.querySelectorAll('.pswp-image');
            var galleryItems = [];
            var imagesLoaded = false;

            // 预加载所有图片尺寸
            var preloadImages = function(callback) {
                if (imagesLoaded) {
                    callback();
                    return;
                }

                var loadedCount = 0;
                var totalCount = pswpImageElements.length;

                pswpImageElements.forEach(function(imgEl, index) {
                    var src = imgEl.getAttribute('data-pswp-src');
                    var width = parseInt(imgEl.getAttribute('data-image-width')) || 3024;
                    var height = parseInt(imgEl.getAttribute('data-image-height')) || 1964;

                    galleryItems[index] = {
                        src: src,
                        w: width,
                        h: height
                    };

                    var tempImg = new Image();
                    tempImg.onload = function() {
                        galleryItems[index].w = tempImg.naturalWidth || width;
                        galleryItems[index].h = tempImg.naturalHeight || height;
                        loadedCount++;
                        if (loadedCount === totalCount) {
                            imagesLoaded = true;
                            callback();
                        }
                    };
                    tempImg.onerror = function() {
                        loadedCount++;
                        if (loadedCount === totalCount) {
                            imagesLoaded = true;
                            callback();
                        }
                    };
                    tempImg.src = src;
                });
            };

            // 为每张图片添加点击事件
            pswpImageElements.forEach(function(el) {
                el.style.cursor = 'zoom-in';
                el.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    var clickedIndex = Array.prototype.indexOf.call(pswpImageElements, el);

                    preloadImages(function() {
                        var options = {
                            index: clickedIndex,
                            bgOpacity: 0.85,
                            showHideOpacity: true,
                            history: false,
                            focus: false
                        };

                        var pswpElement = document.querySelector('.pswp');
                        var gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, galleryItems, options);

                        gallery.init();
                    });
                });
            });
        });
    </script>

<script type="text/javascript" src="../protect.js"></script>

document.addEventListener('contextmenu', function(e) {
